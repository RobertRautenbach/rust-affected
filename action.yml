name: rust-affected
description: >
  Computes affected Cargo workspace members from a set of changed files
  via the Cargo dependency graph.
author: Robert Rautenbach
branding:
  icon: git-branch
  color: orange

inputs:
  changed_files_json:
    description: >
      JSON array of changed file paths relative to the workspace root, such as
      ["src/lib.rs","docs/my file.md"], including deletions and both paths of
      renames. Use [] when nothing changed; a missing or blank value fails the
      action. Each element is one exact path: nothing is split or unquoted, so
      any filename is supported. Leading ./ and absolute paths beneath the
      workspace root are accepted. Typically produced by
      `tj-actions/changed-files` with `json: true` or `dorny/paths-filter`
      with `list-files: json`.
    required: true
  force_triggers:
    description: >
      Space- or newline-separated list of glob patterns that trigger a full rebuild of the entire
      workspace when any matching file changes. Supports *, **, and ? via globset.
      A bare name (e.g. "Cargo.lock") matches that exact path only.
      A trailing slash (e.g. "infra/") matches the directory and everything inside it.
      Full glob patterns are also supported (e.g. "**/*.sql", ".github/**").
      Patterns are relative to the workspace root; an empty or absolute pattern,
      or one containing "..", can never match and fails the action.
      If omitted, no force triggers are applied.
    required: false
  excluded_members:
    description: >
      Space- or newline-separated list of workspace member names or path prefixes
      to exclude from all outputs (changed_crates, affected_library_members,
      affected_binary_members). A plain name (e.g. "my-tool") matches the crate
      name directly. An entry containing "/" is matched against the crate's
      directory relative to the workspace root: a trailing slash (e.g. "tools/")
      excludes every crate under that directory, while an exact relative path
      (e.g. "tools/my-tool") excludes that crate and members nested beneath it.
      Leading ./ and redundant separators are accepted in path prefixes. Useful for internal
      tooling or helper crates that should never be deployed.
      If omitted, no members are excluded.
    required: false
  ignore_cargo_config:
    description: >
      Set to "true" to run Cargo from outside the checkout, so the repository's
      .cargo/config.toml and rust-toolchain files are not read. A pull request
      can otherwise use them to make Cargo run arbitrary programs during
      detection. Settings that only exist in that configuration, such as
      [patch] entries, vendored sources and private registries, are then
      ignored, and resolution fails if the workspace depends on them.
      Defaults to "false".
    required: false
    default: 'false'

outputs:
  changed_crates:
    description: JSON array of crates with directly changed files
  affected_library_members:
    description: JSON array of affected pure library workspace members (no binary target), including transitive dependents
  affected_binary_members:
    description: JSON array of affected workspace members with a binary target, including transitive dependents
  force_all:
    description: Whether a force-trigger file changed

runs:
  using: docker
  image: 'docker://ghcr.io/robertrautenbach/rust-affected:v4.4.0@sha256:bd9448a2b5a2bb8578c1422c10847ecb9a5b53af0416cc724fa19c3ca21912f2'
  env:
    CHANGED_FILES_JSON: ${{ inputs.changed_files_json }}
    FORCE_TRIGGERS: ${{ inputs.force_triggers }}
    EXCLUDED_MEMBERS: ${{ inputs.excluded_members }}
    IGNORE_CARGO_CONFIG: ${{ inputs.ignore_cargo_config }}
