name: rust-affected
description: >
  Computes affected Cargo workspace packages from a set of changed files
  via the Cargo dependency graph.
author: Robert Rautenbach
branding:
  icon: git-branch
  color: orange

inputs:
  changed_files_json:
    description: >
      JSON array of changed file paths relative to the workspace root, such as
      ["src/lib.rs","docs/my file.md"], including deletions and both paths of
      renames. Use [] when nothing changed; a missing or blank value fails the
      action. Each element is one exact path: nothing is split or unquoted, so
      any filename is supported. Leading ./ and absolute paths beneath the
      workspace root are accepted. Typically produced by
      `tj-actions/changed-files` with `json: true` or `dorny/paths-filter`
      with `list-files: json`.
    required: true
  force_triggers:
    description: >
      Space- or newline-separated list of glob patterns that trigger a full rebuild of the entire
      workspace when any matching file changes. Supports *, **, and ? via globset.
      A bare name (e.g. "Cargo.lock") matches that exact path only.
      A trailing slash (e.g. "infra/") matches the directory and everything inside it.
      Full glob patterns are also supported (e.g. "**/*.sql", ".github/**").
      Patterns are relative to the workspace root; an empty or absolute pattern,
      or one containing "..", can never match and fails the action.
      If omitted, no force triggers are applied.
    required: false
  excluded_packages:
    description: >
      Space- or newline-separated list of workspace package names or path prefixes
      to exclude from all outputs (changed_packages, affected_libraries,
      affected_binaries). A plain name (e.g. "my-tool") matches the package
      name directly. An entry containing "/" is matched against the package's
      directory relative to the workspace root: a trailing slash (e.g. "tools/")
      excludes every package under that directory, while an exact relative path
      (e.g. "tools/my-tool") excludes that package and packages nested beneath it.
      Leading ./ and redundant separators are accepted in path prefixes. Useful for internal
      tooling or helper packages that should never be deployed.
      If omitted, no packages are excluded.
    required: false
  trust_cargo_config:
    description: >
      Set to "true" to let Cargo read the repository's .cargo/config.toml. By
      default ("false") Cargo runs from outside the checkout and does not read
      it, because a pull request can use it to make Cargo run arbitrary
      programs during detection. Set it only where the checkout is trusted,
      when the workspace depends on settings that exist only in that
      configuration, such as [patch] entries, vendored sources, private
      registries or net.git-fetch-with-cli. A rust-toolchain file is never
      used: the action runs its own pinned toolchain.
    required: false
    default: 'false'

outputs:
  changed_packages:
    description: JSON array of packages with directly changed files
  affected_libraries:
    description: JSON array of affected workspace packages without a binary target, including transitive dependents
  affected_binaries:
    description: JSON array of affected workspace packages with a binary target, including transitive dependents. A package with both a library and a binary appears only here
  force_all:
    description: Whether a force-trigger file changed

runs:
  using: docker
  image: 'docker://ghcr.io/robertrautenbach/rust-affected:v5.0.2@sha256:e9e88baa212b0e91a680828904166f75eeed1592cae2ad7f1b4a98e33c680eb0'
